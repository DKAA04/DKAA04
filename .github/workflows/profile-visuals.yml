name: Refresh public portfolio visuals
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read public data and render SVGs
        run: python3 update_visuals.py
      - name: Commit refreshed facts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add activity.svg languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public portfolio visuals'
            git push
          fi
